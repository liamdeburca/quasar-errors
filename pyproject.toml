[build-system]
requires = [
    "wheel", 
    "setuptools==72.1.0",
    "Cython==3.0.12", 
    "numpy==1.26",
]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-errors"
authors = [{name = "Liam", email = "liam_deburca@me.com"}]
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "quasar-typing==0.1.0",
    "quasar-models==0.1.0",
    "quasar-utils==0.1.0",
    
    "pydantic==2.12",
    "astropy==7.0",
    "numpy==1.26",
    "scipy==1.16",
    "lazy-imports==1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "black==26.10.1",
    "isort==9.0.2",
    "uncertainties==3.2.3",
    "numba==0.62.1",
]

[project.urls]
Homepage = "https://github.com/liamdeburca/quasar-errors"
Repository = "https://github.com/liamdeburca/quasar-errors.git"
"Bug Tracker" = "https://github.com/liamdeburca/quasar-errors/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79

[lint.pyupgrade]
keep-runtime-typing = true