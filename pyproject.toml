[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2", "Cython>=3.0", "numpy>=1.26"]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-errors"
version = "0.1.0"
requires-python= ">=3.12"
dependencies = [
    "quasar-typing",
    "quasar-models",
    "quasar-utils",
    "astropy>=7.0",
    "pydantic>=2.12",
    "numpy>=1.26",
    "scipy>=1.16",
]

[project.urls]
Homepage = "https://github.com/liamdeburca/quasar-errors"
Repository = "https://github.com/liamdeburca/quasar-errors.git"
"Bug Tracker" = "https://github.com/liamdeburca/quasar-errors/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79

[lint.pyupgrade]
keep-runtime-typing = true